[book]
title = "@deckyard/magick"
description = "Image processing through the ImageMagick 7 command line: resize, crop, convert, annotate, compare, with safe defaults"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "orchid"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://deckyard.github.io/deck-magick/"
repoUrl = "https://github.com/deckyard/deck-magick"
repoLabel = "Source"
editUrl = "https://github.com/deckyard/deck-magick/edit/main/docs/{path}"

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
